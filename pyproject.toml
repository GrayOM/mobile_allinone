[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-security-workbench"
version = "0.2.0"
description = "Local, evidence-first mobile application security workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "androguard>=4.1,<5",
  "cryptography>=46.0.6,<48",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
